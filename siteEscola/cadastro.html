<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Sistema Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center aluno">

  <div class="card-auth">

    <div class="login-banner">
      <h1>Bem-vindo!</h1>
      <p>
        Crie sua conta e tenha acesso ao sistema escolar.
      </p>
    </div>

    <div class="login-form">

      <img src="img/logo.png" class="logo" alt="Logo">

      <h2>Criar Conta</h2>

      <p class="subtitulo">
        Preencha os dados abaixo
      </p>

      <form id="formCadastro">

        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Nome">
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="exemplo@email.com">
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Crie uma senha">
        </div>

        <div id="area-turma" class="input-group">
          <label for="codigoTurma">Código da Turma</label>
          <input type="text" id="codigoTurma" placeholder="Peça o código ao professor">
        </div>

        <button class="btn-submit" type="submit">
          Finalizar Cadastro
        </button>

      </form>

      <p class="auth-footer">
        Já possui uma conta?
        <a href="login.html" class="auth-link">
          <strong>Fazer login</strong>
        </a>
      </p>

    </div>

  </div>

  <script src="js/theme.js"></script>
  <script src="js/db.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
