<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="center"> 
  <div class="card-auth">

  <div class="login-banner">
    <h1>Bem-vindo!</h1>
    <p>
      Você pode acessar o sistema escolar utilizando
      suas credenciais cadastradas.
    </p>
  </div>

  <div class="login-form">

    <img src="img/logo.png" class="logo" alt="Logo">

    <h2>Entrar</h2>
    <p class="subtitulo">
      Entre com as suas credenciais
    </p>

    <form id="formLogin">

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="exemplo@email.com">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••">
      </div>

      <button class="btn-submit" type="submit">
        Entrar no Sistema
      </button>

    </form>

    <p class="auth-footer">
      Não tem uma conta?
      <a href="cadastro.html" class="auth-link">
        <strong>Criar conta</strong>
      </a>
    </p>

  </div>

</div>

  <script src="js/theme.js"></script>
  <script src="js/db.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
